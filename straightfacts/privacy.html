<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting to Fact Snack…</title>
  <link rel="canonical" href="https://factsnack.skorulis.com/privacy.html" />
  <meta http-equiv="refresh" content="0; url=https://factsnack.skorulis.com/privacy.html" />
  <script>
    (function () {
      var path = location.pathname.replace(/^\/straightfacts/, "/factsnack");
      if (location.hostname === "straightfacts.skorulis.com") {
        path = location.pathname;
      }
      var dest =
        location.hostname === "straightfacts.skorulis.com"
          ? "https://factsnack.skorulis.com" + path
          : path;
      location.replace(dest + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>Moved to <a href="https://factsnack.skorulis.com/privacy.html">Fact Snack privacy policy</a>.</p>
</body>
</html>
